<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUKSY — Admin</title>
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a; --panel: #141414; --panel2: #1b1b1b; --border: rgba(255,255,255,0.09);
      --text: #ececec; --muted: rgba(255,255,255,0.5); --dim: rgba(255,255,255,0.3);
      --red: #e53935; --red-h: #ff504a; --green: #4caf50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    button { font-family: inherit; cursor: pointer; color: inherit; }
    input, textarea, select { font-family: inherit; color: #fff; }

    /* ---- Login ---- */
    #login { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 25%, #1c0d0d, var(--bg)); }
    #login.off { display: none; }
    #login .card { background: var(--panel); border: 1px solid var(--border); padding: 44px 36px; width: 360px; text-align: center; }
    #login h1 { font-size: 28px; letter-spacing: 6px; color: var(--red); font-weight: 300; margin-bottom: 6px; }
    #login .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    #login input { width: 100%; padding: 13px 15px; background: var(--panel2); border: 1px solid var(--border); font-size: 14px; margin-bottom: 12px; text-align: center; outline: none; }
    #login input:focus { border-color: var(--red); }
    #login button { width: 100%; padding: 13px; background: var(--red); border: none; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    #login button:hover { background: var(--red-h); }
    #login .err { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; }
    #login .err.on { display: block; }

    /* ---- Layout ---- */
    #app { display: none; height: 100vh; }
    #app.on { display: flex; }
    #side { width: 230px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    #side .brand { padding: 20px 18px; border-bottom: 1px solid var(--border); }
    #side .brand b { font-size: 19px; letter-spacing: 4px; color: var(--red); font-weight: 300; }
    #side .brand .who { font-size: 11px; color: var(--dim); margin-top: 3px; }
    #side nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    #side nav .grp { padding: 14px 18px 5px; font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
    #side nav .it { padding: 10px 18px; font-size: 14px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 9px; border-left: 2px solid transparent; }
    #side nav .it:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    #side nav .it.on { color: #fff; border-left-color: var(--red); background: rgba(229,57,53,0.1); }
    #side .foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    #side .foot button { padding: 9px; font-size: 12px; background: none; border: 1px solid var(--border); color: var(--muted); }
    #side .foot button:hover { color: var(--text); border-color: var(--red); }
    #side .foot .prev { color: var(--red); border-color: var(--red); }

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #bar { padding: 13px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    #bar .t { font-size: 16px; font-weight: 600; }
    #bar .r { display: flex; align-items: center; gap: 9px; }
    #bar .st { font-size: 12px; color: var(--dim); margin-right: 4px; }
    .btn { padding: 9px 16px; font-size: 13px; font-weight: 600; border: none; }
    .btn.primary { background: var(--red); color: #fff; }
    .btn.primary:hover { background: var(--red-h); }
    .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
    .btn.ghost:hover { color: var(--text); border-color: var(--red); }

    #body { flex: 1; overflow-y: auto; padding: 26px 30px; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--dim); gap: 12px; font-size: 14px; }
    .empty .big { font-size: 40px; }

    /* ---- Catalog ---- */
    .cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cat-head .n { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .pcard { background: var(--panel); border: 1px solid var(--border); overflow: hidden; cursor: pointer; position: relative; transition: transform .15s, border-color .15s; }
    .pcard:hover { border-color: rgba(229,57,53,.5); transform: translateY(-2px); }
    .pcard .img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: var(--panel2); display: block; }
    .pcard .noimg { width: 100%; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 30px; background: var(--panel2); }
    .pcard .stock { position: absolute; top: 9px; right: 9px; padding: 3px 9px; font-size: 10px; font-weight: 700; }
    .pcard .stock.ok { background: rgba(76,175,80,.2); color: var(--green); border: 1px solid rgba(76,175,80,.4); }
    .pcard .stock.out { background: rgba(229,57,53,.2); color: var(--red); border: 1px solid rgba(229,57,53,.4); }
    .pcard .info { padding: 12px 14px; }
    .pcard .info .nm { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .pcard .info .pr { font-size: 14px; color: var(--red); font-weight: 600; }
    .pcard .info .pr s { color: var(--dim); font-weight: 400; font-size: 12px; margin-right: 6px; }

    /* ---- Forms ---- */
    .sec { margin-bottom: 24px; }
    .sec > .tt { font-size: 11px; letter-spacing: 2px; color: var(--red); text-transform: uppercase; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .f { margin-bottom: 13px; }
    .f > label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .f input, .f textarea, .f select { width: 100%; padding: 10px 13px; background: var(--panel2); border: 1px solid var(--border); font-size: 13px; outline: none; }
    .f input:focus, .f textarea:focus, .f select:focus { border-color: var(--red); }
    .f textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
    .f textarea.tall { min-height: 130px; }
    .f .iwrap { display: flex; gap: 8px; }
    .f .iwrap input { flex: 1; }
    .f .iwrap button { padding: 0 15px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); font-size: 17px; }
    .f .iwrap button:hover { border-color: var(--red); color: #fff; }
    .f .prev img { max-width: 150px; max-height: 95px; border: 1px solid var(--border); border-radius: 4px; margin-top: 8px; display: block; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cbox { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0; }
    .cbox input { width: auto; }
    .cbox label { margin: 0; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; cursor: pointer; }
    .crow { display: flex; gap: 22px; flex-wrap: wrap; }
    .arr { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    .arr input { flex: 1; }
    .arr .x { background: none; border: none; color: var(--dim); font-size: 16px; padding: 3px 7px; }
    .arr .x:hover { color: var(--red); }
    .arr.box { border: 1px solid var(--border); padding: 10px; border-radius: 4px; align-items: flex-start; }
    .arr.box .sz { max-width: 110px; }
    .arr.box .av { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .arr.box .av input { width: auto; flex: none; }
    .arr.box .av label { font-size: 12px; color: var(--muted); }
    .addarr { padding: 7px 14px; font-size: 12px; background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; }
    .addarr:hover { border-color: var(--red); color: #fff; }
    .danger { color: var(--red) !important; border-color: var(--red) !important; }

    /* ---- Toast ---- */
    #toast { position: fixed; bottom: 22px; right: 22px; z-index: 3000; padding: 13px 20px; background: #1a1a1a; border: 1px solid var(--border); font-size: 13px; display: none; max-width: 360px; box-shadow: 0 8px 26px rgba(0,0,0,.5); }
    #toast.on { display: block; }
    #toast.ok { border-color: var(--green); }
    #toast.err { border-color: var(--red); }

    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

    @media (max-width: 700px) {
      #app { flex-direction: column; }
      #side { width: 100%; height: auto; flex-direction: column; border-right: none; border-bottom: 1px solid var(--border); }
      #side nav { display: flex; overflow-x: auto; }
      #side nav .grp { display: none; }
      #side nav .it { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; }
      #side nav .it.on { border-bottom-color: var(--red); }
      #side .foot { flex-direction: row; }
      #body { padding: 16px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .g2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>BUKSY</h1>
    <div class="sub">Панель керування</div>
    <div class="err" id="login-err"></div>
    <form id="login-form" autocomplete="off">
      <input type="text" id="login-in" placeholder="Логін" autocomplete="off" />
      <input type="password" id="pass-in" placeholder="Пароль" autocomplete="off" />
      <button type="submit">Увійти</button>
    </form>
  </div>
</div>

<div id="app">
  <aside id="side">
    <div class="brand"><b>BUKSY</b><div class="who" id="who"></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <button class="prev" onclick="openPreview()">👁 Сайт</button>
      <button onclick="logout()">Вийти</button>
    </div>
  </aside>
  <div id="main">
    <div id="bar">
      <div class="t" id="title">Каталог</div>
      <div class="r">
        <span class="st" id="status"></span>
        <button class="btn ghost" id="back" style="display:none" onclick="goBack()">←</button>
        <button class="btn ghost" onclick="reload()">⟳</button>
        <button class="btn primary" id="save" onclick="save()">Зберегти</button>
      </div>
    </div>
    <div id="body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
var REPO = 'porustzi/buksy';
var BRANCH = 'main';
// Images are served from the SAME site, so use relative paths (no raw.githubusercontent)
var SITE = '';

var SECTIONS = [
  { id: 'catalog', label: 'Каталог', icon: '📦', type: 'catalog' },
  { id: 'homepage', label: 'Головна', icon: '🏠', path: 'content/pages/homepage/homepage.json' },
  { id: 'about', label: 'Про нас', icon: 'ℹ️', path: 'content/pages/about/about.json' },
  { id: 'contact', label: 'Контакти', icon: '✉️', path: 'content/pages/contact/contact.json' },
  { id: 'footer', label: 'Футер', icon: '🔗', path: 'content/pages/footer/footer.json' },
];

var CATS = ['hoodies','t-shirts','jackets','pants','accessories','footwear'];
var CAT_LABEL = { hoodies:'Худі', 't-shirts':'Футболки', jackets:'Куртки', pants:'Штани', accessories:'Аксесуари', footwear:'Взуття' };

var token = null, curSection = null, curData = null, curSha = null, curProductPath = null, n = 0;

// ---- auth ----
function getToken(){ return localStorage.getItem('buksy-admin-token')||localStorage.getItem('gh-token')||localStorage.getItem('admin-token'); }
function setToken(t){ localStorage.setItem('buksy-admin-token',t); localStorage.setItem('gh-token',t); }
function clearToken(){ ['buksy-admin-token','gh-token','admin-token'].forEach(function(k){localStorage.removeItem(k);}); }

// ---- api ----
function api(action, data){
  var p = Object.assign({action:action}, data||{});
  return fetch('/api/github',{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(p)})
    .then(function(r){ if(r.status===401||r.status===403){ logout(); throw new Error('Сесія закінчилась'); } if(!r.ok) throw new Error('API '+r.status); return r.json(); });
}
function dec(bin){ var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
function readFile(path){ return api('read',{path:path}).then(function(d){ if(!d) throw new Error('Файл не знайдено'); return {content:dec(atob(d.content.replace(/\n/g,''))), sha:d.sha}; }); }
function writeFile(path,content,sha){ return api('write',{path:path,content:content,sha:sha,message:'Update '+path}); }
function uploadFile(name,b64){ return api('upload',{name:name,content:b64,folder:'public/uploads'}); }

// ---- yaml ----
function parseYaml(t){ var m=t.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/); if(!m)return {data:{}}; try{return{data:jsyaml.load(m[1])||{}};}catch(e){return{data:{}};} }
function dumpYaml(d){ return '---\n'+jsyaml.dump(d,{lineWidth:-1,noRefs:true,quotingType:'"',forceQuotes:true}).trim()+'\n---\n'; }

// ---- helpers ----
function esc(s){ if(s==null)return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m,ok){ var t=document.getElementById('toast'); t.textContent=m; t.className='on'+(ok?' ok':' err'); clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},3200); }
function gid(){ return 'f'+(++n); }
function isImg(v){ return typeof v==='string'&&(v.match(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i)||v.match(/^https?:\/\//)); }
// images use relative path — same origin as admin
function imgSrc(v){ if(!v)return ''; if(v.match(/^https?:\/\//))return v; return v; }

// ---- nav ----
function buildNav(){
  var h='<div class="grp">Магазин</div><div class="it" data-s="catalog" onclick="open(\'catalog\')"><span>📦</span> Каталог</div><div class="grp">Сторінки</div>';
  for(var i=1;i<SECTIONS.length;i++){ var s=SECTIONS[i]; h+='<div class="it" data-s="'+s.id+'" onclick="open(\''+s.id+'\')"><span>'+s.icon+'</span> '+s.label+'</div>'; }
  document.getElementById('nav').innerHTML=h;
}
function setActive(id){ var els=document.querySelectorAll('#nav .it'); for(var i=0;i<els.length;i++)els[i].classList.toggle('on', els[i].getAttribute('data-s')===id); }

// ---- open ----
function open(id){
  curSection=null; curData=null; curSha=null; curProductPath=null;
  setActive(id);
  document.getElementById('back').style.display='none';
  document.getElementById('save').style.display='none';
  document.getElementById('status').textContent='';
  var s=SECTIONS.find(function(x){return x.id===id;});
  document.getElementById('title').textContent=s.label;
  curSection=s;
  if(s.type==='catalog'){ loadCatalog(); return; }
  document.getElementById('save').style.display='';
  document.getElementById('save').disabled=true;
  document.getElementById('body').innerHTML='<div class="empty"><div class="big">…</div>Завантаження</div>';
  readFile(s.path).then(function(r){ curSha=r.sha; curData=JSON.parse(r.content); document.getElementById('body').innerHTML=renderObj(curData); document.getElementById('save').disabled=false; })
    .catch(function(e){ document.getElementById('body').innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; });
}

// ---- generic object form ----
function renderObj(o){
  var h=''; var ks=Object.keys(o||{});
  for(var i=0;i<ks.length;i++){ var k=ks[i], v=o[k], p=k;
    if(v==null){ h+=fInput(k,p,'','text'); }
    else if(typeof v==='string'){ if(isImg(v))h+=fImg(k,p,v); else if(v.length>120||v.indexOf('\n')>-1)h+=fArea(k,p,v,false); else h+=fInput(k,p,v,'text'); }
    else if(typeof v==='number'){ h+=fInput(k,p,String(v),'number'); }
    else if(typeof v==='boolean'){ h+=fCheck(k,p,v); }
    else if(Array.isArray(v)){ h+=fArray(k,p,v); }
    else if(typeof v==='object'){ h+='<div class="sec"><div class="tt">'+esc(k)+'</div>'+renderObjNested(v,p)+'</div>'; }
  }
  return h;
}
function renderObjNested(o,prefix){
  var h=''; var ks=Object.keys(o||{});
  for(var i=0;i<ks.length;i++){ var k=ks[i], v=o[k], p=prefix+'.'+k;
    if(v==null){ h+=fInput(k,p,'','text'); }
    else if(typeof v==='string'){ if(isImg(v))h+=fImg(k,p,v); else if(v.length>120||v.indexOf('\n')>-1)h+=fArea(k,p,v,false); else h+=fInput(k,p,v,'text'); }
    else if(typeof v==='number'){ h+=fInput(k,p,String(v),'number'); }
    else if(typeof v==='boolean'){ h+=fCheck(k,p,v); }
    else if(Array.isArray(v)){ h+=fArray(k,p,v); }
    else if(typeof v==='object'){ h+='<div class="sec"><div class="tt">'+esc(k)+'</div>'+renderObjNested(v,p)+'</div>'; }
  }
  return h;
}
function fInput(label,path,val,type){ var id=gid(); return '<div class="f"><label>'+esc(label)+'</label><input type="'+(type||'text')+'" id="'+id+'" value="'+esc(val)+'" data-p="'+path+'"'+(type==='number'?' step="any"':'')+' /></div>'; }
function fArea(label,path,val,tall){ var id=gid(); return '<div class="f"><label>'+esc(label)+'</label><textarea id="'+id+'" class="'+(tall?'tall':'')+'" data-p="'+path+'">'+esc(val)+'</textarea></div>'; }
function fCheck(label,path,on){ var id=gid(); return '<div class="cbox"><input type="checkbox" id="'+id+'" data-p="'+path+'"'+(on?' checked':'')+' /><label>'+esc(label)+'</label></div>'; }
function fImg(label,path,val){ var id=gid(); var h='<div class="f"><label>'+esc(label)+'</label><div class="iwrap"><input type="text" id="'+id+'" value="'+esc(val)+'" data-p="'+path+'" /><button onclick="upImg(this,\''+path+'\')">📁</button></div>'; if(val)h+='<div class="prev"><img src="'+esc(imgSrc(val))+'" onerror="this.style.display=\'none\'" /></div>'; h+='</div>'; return h; }
function fArray(label,path,arr){
  var h='<div class="sec"><div class="tt">'+esc(label)+'</div><div data-arr="'+path+'">';
  for(var i=0;i<arr.length;i++)h+=arrItem(arr[i],path+'.'+i);
  h+='</div><button class="addarr" onclick="addArr(\''+path+'\')">+ Додати</button></div>';
  return h;
}
function arrItem(item,path){
  var id=gid();
  if(item!=null&&typeof item==='object'){
    var h='<div class="arr box"><button class="x" onclick="rmArr(this)">✕</button><div style="flex:1">'+renderObjNested(item,path)+'</div></div>';
    return h;
  }
  return '<div class="arr"><input type="text" value="'+esc(String(item))+'" data-p="'+path+'" /><button class="x" onclick="rmArr(this)">✕</button></div>';
}
function addArr(path){
  var c=document.querySelector('[data-arr="'+path+'"]'); if(!c)return;
  var cnt=c.querySelectorAll('[data-p^="'+path+'."]').length;
  var first=c.querySelector('input[type="text"][data-p], textarea[data-p], input[type="checkbox"][data-p]');
  if(first && first.tagName!=='TEXTAREA'){
    // check if it's object array (has nested .key) or simple string array
    var simple = c.querySelector('input[type="text"][data-p^="'+path+'."]');
    if(simple && simple.getAttribute('data-p').split('.').length === 2 && !first.getAttribute('data-p').match(/\.\d+\./)){
      c.insertAdjacentHTML('beforeend','<div class="arr"><input type="text" data-p="'+path+'.'+cnt+'" /><button class="x" onclick="rmArr(this)">✕</button></div>');
      return;
    }
  }
  // object array: sample from first
  var sample={};
  c.querySelectorAll('[data-p^="'+path+'."]').forEach(function(inp){
    var parts=inp.getAttribute('data-p').split('.'); var k=parts[parts.length-1];
    if(k.match(/^\d+$/))return;
    if(inp.type==='checkbox')sample[k]=false; else sample[k]='';
  });
  var d=document.createElement('div'); d.className='arr box'; d.innerHTML='<button class="x" onclick="rmArr(this)">✕</button><div style="flex:1">'+renderObjNested(sample,path+'.'+cnt)+'</div>';
  c.appendChild(d);
}
function rmArr(b){ b.closest('.arr').remove(); }

// ---- collect ----
function collect(){
  var o={};
  document.querySelectorAll('#body [data-p]').forEach(function(el){
    var parts=el.getAttribute('data-p').split('.'); var parent=o;
    for(var j=0;j<parts.length-1;j++){ var p=parts[j];
      if(p.match(/^\d+$/)){ var idx=parseInt(p); if(!parent[idx])parent[idx]={}; parent=parent[idx]; }
      else { if(parent[p]===undefined){ parent[p]=(parts[j+1].match(/^\d+$/))?[]:{}; } parent=parent[p]; }
    }
    var last=parts[parts.length-1];
    if(el.type==='checkbox')parent[last]=el.checked;
    else if(el.type==='number')parent[last]=(el.value==='')?null:parseFloat(el.value);
    else parent[last]=el.value;
  });
  return o;
}

// ---- catalog ----
function loadCatalog(){
  document.getElementById('title').textContent='Каталог';
  document.getElementById('save').style.display='none';
  document.getElementById('body').innerHTML='<div class="empty"><div class="big">…</div>Завантаження</div>';
  api('list',{folder:'content/products'}).then(function(files){
    files=(files||[]).filter(function(f){return f.name!=='.gitkeep';});
    if(!files.length){ document.getElementById('body').innerHTML='<div class="empty"><div class="big">📦</div>Немає товарів<button class="btn primary" onclick="addProduct()">+ Додати товар</button></div>'; return; }
    var h='<div class="cat-head"><span class="n">'+files.length+' товарів</span><button class="btn primary" onclick="addProduct()">+ Додати товар</button></div><div class="grid">';
    var cards=[]; var loaded=0;
    files.forEach(function(f,i){
      readFile('content/products/'+f.name).then(function(r){
        var d={}; try{d=parseYaml(r.content).data||{};}catch(e){}
        cards[i]=renderCard(d,f.name); loaded++;
        if(loaded===files.length)finish();
      }).catch(function(){ loaded++; if(loaded===files.length)finish(); });
    });
    function finish(){ document.getElementById('body').innerHTML=h+cards.filter(Boolean).join('')+'</div>'; }
  }).catch(function(e){ document.getElementById('body').innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; });
}
function renderCard(d,file){
  var img=d.image1||(d.images&&d.images[0])||'';
  var name=d.name||file.replace('.md','');
  var price=(d.price!=null)?d.price:'';
  var orig=d.originalPrice||'';
  var out=(d.stock!==undefined&&d.stock<=0);
  var h='<div class="pcard" onclick="editProduct(\'content/products/'+esc(file)+'\')">';
  if(img)h+='<img class="img" src="'+esc(imgSrc(img))+'" onerror="this.style.display=\'none\'" />';
  else h+='<div class="noimg">📷</div>';
  if(d.stock!==undefined)h+='<span class="stock '+(out?'out':'ok')+'">'+(out?'Немає':d.stock+' шт')+'</span>';
  h+='<div class="info"><div class="nm">'+esc(name)+'</div><div class="pr">'+(orig?'<s>₴'+esc(orig)+'</s>':'')+(price!==''?'₴'+esc(price):'—')+'</div></div></div>';
  return h;
}

// ---- product editor ----
function editProduct(path){
  curProductPath=path;
  document.getElementById('title').textContent='Товар';
  document.getElementById('back').style.display='';
  document.getElementById('save').style.display='';
  document.getElementById('save').disabled=true;
  document.getElementById('body').innerHTML='<div class="empty"><div class="big">…</div>Завантаження</div>';
  readFile(path).then(function(r){ curSha=r.sha; curData=parseYaml(r.content).data||{}; document.getElementById('body').innerHTML=renderProduct(curData); document.getElementById('save').disabled=false; })
    .catch(function(e){ document.getElementById('body').innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; });
}
function renderProduct(p){
  var h='<div class="g2"><div>';
  h+='<div class="sec"><div class="tt">Основне</div>';
  h+=fInput('Назва','name',p.name||'','text');
  h+=fInput('Slug','slug',p.slug||'','text');
  h+='<div class="g2">'+fInput('Ціна ₴','price',p.price!=null?p.price:'','number')+fInput('Стара ціна ₴','originalPrice',p.originalPrice||'','number')+'</div>';
  h+='<div class="f"><label>Категорія</label><select data-p="category">';
  CATS.forEach(function(c){h+='<option value="'+c+'"'+(p.category===c?' selected':'')+'>'+CAT_LABEL[c]+'</option>';});
  h+='</select></div>';
  h+=fInput('Сток (шт)','stock',p.stock!=null?p.stock:'','number');
  h+='<div class="crow">'+fCheck('В наявності','inStock',p.inStock!==false)+fCheck('Новий','isNew',!!p.isNew)+fCheck('Обране','isFeatured',!!p.isFeatured)+fCheck('Бестселер','isBestseller',!!p.isBestseller)+'</div>';
  h+=fInput('Рейтинг','rating',p.rating!=null?p.rating:'','number');
  h+='</div>';
  h+='<div class="sec"><div class="tt">Зображення</div>';
  h+=fImg('Фото 1','image1',p.image1||'');
  h+=fImg('Фото 2','image2',p.image2||'');
  h+=fImg('Фото 3','image3',p.image3||'');
  h+='</div></div><div>';
  h+='<div class="sec"><div class="tt">Розміри</div><div data-arr="sizes">';
  (p.sizes||[]).forEach(function(s,i){
    h+='<div class="arr box"><button class="x" onclick="rmArr(this)">✕</button><input class="sz" type="text" value="'+esc(s.name||'')+'" data-p="sizes.'+i+'.name" placeholder="S/M/L" /><div class="av"><input type="checkbox" data-p="sizes.'+i+'.available"'+(s.available!==false?' checked':'')+' /><label>є в наявності</label></div></div>';
  });
  h+='</div><button class="addarr" onclick="addSize()">+ Розмір</button></div>';
  h+='</div></div>';
  h+='<div class="sec"><div class="tt">Короткий опис</div>'+fArea('','shortDescription',p.shortDescription||'',true)+'</div>';
  h+='<div class="sec"><div class="tt">Опис</div>'+fArea('','description',p.description||'',true)+'</div>';
  h+='<div class="g2">';
  h+='<div class="sec"><div class="tt">Деталі</div><div data-arr="details">';
  (p.details||[]).forEach(function(d,i){h+='<div class="arr"><input type="text" value="'+esc(d)+'" data-p="details.'+i+'" /><button class="x" onclick="rmArr(this)">✕</button></div>';});
  h+='</div><button class="addarr" onclick="addSimple(\'details\')">+ Додати</button></div>';
  h+='<div class="sec"><div class="tt">Догляд</div><div data-arr="care">';
  (p.care||[]).forEach(function(c,i){h+='<div class="arr"><input type="text" value="'+esc(c)+'" data-p="care.'+i+'" /><button class="x" onclick="rmArr(this)">✕</button></div>';});
  h+='</div><button class="addarr" onclick="addSimple(\'care\')">+ Додати</button></div>';
  h+='</div>';
  h+='<div class="sec"><div class="tt">Небезпечно</div><button class="btn ghost danger" onclick="delProduct()">🗑 Видалити товар</button></div>';
  return h;
}
function addSize(){
  var c=document.querySelector('[data-arr="sizes"]'); if(!c)return;
  var cnt=c.querySelectorAll('.arr').length;
  c.insertAdjacentHTML('beforeend','<div class="arr box"><button class="x" onclick="rmArr(this)">✕</button><input class="sz" type="text" data-p="sizes.'+cnt+'.name" placeholder="S/M/L" /><div class="av"><input type="checkbox" data-p="sizes.'+cnt+'.available" checked /><label>є в наявності</label></div></div>');
}
function addSimple(path){
  var c=document.querySelector('[data-arr="'+path+'"]'); if(!c)return;
  var cnt=c.querySelectorAll('.arr').length;
  c.insertAdjacentHTML('beforeend','<div class="arr"><input type="text" data-p="'+path+'.'+cnt+'" /><button class="x" onclick="rmArr(this)">✕</button></div>');
}
function addProduct(){
  var slug='product-'+Date.now().toString(36)+'-'+Math.random().toString(36).substr(2,4);
  var d={id:String(Date.now()),name:'Новий товар',slug:slug,price:0,category:'t-shirts',image1:'',image2:'',image3:'',sizes:[{name:'S',available:true},{name:'M',available:true},{name:'L',available:true}],inStock:true,stock:1,isNew:false,isFeatured:false,isBestseller:false,rating:0,shortDescription:'',description:'',details:[],care:[],reviews:[]};
  var path='content/products/'+slug+'.md';
  writeFile(path,dumpYaml(d),null).then(function(){ toast('Товар створено',true); editProduct(path); }).catch(function(e){ toast('Помилка: '+e.message); });
}
function delProduct(){
  if(!curProductPath)return;
  if(!confirm('Видалити товар?'))return;
  api('delete',{path:curProductPath}).then(function(){ toast('Видалено',true); open('catalog'); }).catch(function(e){ toast('Помилка: '+e.message); });
}
function goBack(){ if(curProductPath){ open('catalog'); } }

// ---- image upload ----
function upImg(btn,path){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/jpeg,image/png,image/webp,image/gif';
  inp.onchange=function(e){
    var file=e.target.files[0]; if(!file)return;
    var r=new FileReader();
    r.onload=function(ev){
      var b64=ev.target.result.split(',')[1];
      var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/jpeg/g,'jpg');
      var name=Date.now()+'_'+Math.random().toString(36).substr(2,4)+'.'+ext;
      btn.disabled=true; btn.textContent='…';
      uploadFile(name,b64).then(function(res){
        var saved=(res&&res.path)?res.path.replace(/^public/,''):('/uploads/'+name);
        var el=btn.parentElement.querySelector('input[type="text"]'); if(el)el.value=saved;
        var f=btn.closest('.f'); var pr=f.querySelector('.prev');
        // show immediate local preview (base64), path resolves after deploy
        if(pr)pr.innerHTML='<img src="data:image/'+ext+';base64,'+b64+'" />';
        else btn.parentElement.insertAdjacentHTML('afterend','<div class="prev"><img src="data:image/'+ext+';base64,'+b64+'" /></div>');
        btn.disabled=false; btn.textContent='📁'; toast('Зображення завантажено',true);
      }).catch(function(err){ btn.disabled=false; btn.textContent='📁'; toast('Помилка: '+err.message); });
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

// ---- save ----
function save(){
  if(!curSection&&!curProductPath)return;
  var btn=document.getElementById('save'); btn.disabled=true; btn.textContent='…';
  document.getElementById('status').textContent='Збереження…';
  var data=collect();
  var path=curProductPath||curSection.path;
  var content=curProductPath?dumpYaml(data):JSON.stringify(data,null,2);
  writeFile(path,content,curSha).then(function(){
    btn.disabled=false; btn.textContent='Зберегти'; document.getElementById('status').textContent='Збережено ✓';
    readFile(path).then(function(r){curSha=r.sha;});
    setTimeout(function(){document.getElementById('status').textContent='';},2500);
    toast('Збережено',true);
  }).catch(function(e){ btn.disabled=false; btn.textContent='Зберегти'; document.getElementById('status').textContent='Помилка'; toast('Помилка: '+e.message); });
}
function reload(){ if(curProductPath)editProduct(curProductPath); else if(curSection)open(curSection.id); }

// ---- preview ----
function openPreview(){ window.open('https://buksy-shop.pages.dev','_blank'); }

// ---- login ----
function login(u,p){ return fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'login='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)}).then(function(r){ if(!r.ok)throw new Error('Невірний логін або пароль'); return r.json(); }); }
function showApp(){ document.getElementById('login').classList.add('off'); document.getElementById('app').classList.add('on'); document.getElementById('who').textContent='porustzi'; buildNav(); open('catalog'); }
function logout(){ clearToken(); token=null; document.getElementById('app').classList.remove('on'); document.getElementById('login').classList.remove('off'); }
function loginErr(m){ var e=document.getElementById('login-err'); e.textContent=m; e.classList.add('on'); }

(function init(){
  var t=getToken(); if(t){ token=t; showApp(); return; }
  document.getElementById('login-form').onsubmit=function(e){
    e.preventDefault();
    var u=document.getElementById('login-in').value, p=document.getElementById('pass-in').value;
    if(!u||!p){ loginErr('Введіть логін і пароль'); return; }
    login(u,p).then(function(d){ setToken(d.token); token=d.token; showApp(); }).catch(function(err){ loginErr(err.message); });
  };
})();
</script>
