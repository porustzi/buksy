<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>BUKSY | Dark Luxury Streetwear</title>
    <meta name="description" content="BUKSY - Premium dark streetwear for the unconventional. Luxury gothic fashion with contemporary edge." />
    <link rel="canonical" href="https://buksy.shop/" />
    <link rel="alternate" hreflang="uk" href="https://buksy.shop/" />
    <link rel="alternate" hreflang="x-default" href="https://buksy.shop/" />

    <!-- Open Graph -->
    <meta property="og:title" content="BUKSY | Dark Luxury Streetwear" />
    <meta property="og:description" content="Premium dark streetwear for the unconventional. Luxury gothic fashion with contemporary edge." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buksy.shop/" />
    <meta property="og:image" content="https://buksy.shop/logo.png" />
    <meta property="og:site_name" content="BUKSY" />
    <meta property="og:locale" content="uk_UA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BUKSY | Dark Luxury Streetwear" />
    <meta name="twitter:description" content="Premium dark streetwear for the unconventional. Luxury gothic fashion with contemporary edge." />
    <meta name="twitter:image" content="https://buksy.shop/logo.png" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BUKSY",
      "url": "https://buksy.shop",
      "logo": "https://buksy.shop/logo.png",
      "description": "Premium dark streetwear for the unconventional.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BUKSY",
      "url": "https://buksy.shop",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://buksy.shop/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://buksy.shop/" },
        { "@type": "ListItem", "position": 2, "name": "Shop", "item": "https://buksy.shop/shop" }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-noir text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
